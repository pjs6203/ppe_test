<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · PPE 시스템</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="login-body">
  <main class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="card login-card p-4">
      <div class="d-flex align-items-center mb-3">
        <div class="logo d-flex align-items-center justify-content-center me-3" style="width:52px;height:52px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;font-weight:700;">P</div>
        <div>
          <h4 class="mb-0">PPE 감지 시스템</h4>
          <small class="d-block">모니터링을 위해 로그인하세요</small>
        </div>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for cat, msg in messages %}
            <div class="alert alert-{{ 'danger' if cat == 'danger' else ( 'success' if cat == 'success' else 'info') }}">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post">
        <div class="mb-3 position-relative">
          <label class="form-label small">사용자</label>
          <input name="username" class="form-control form-control-lg" value="{{ request.form.username or '' }}" required>
        </div>
        <div class="mb-3 position-relative">
          <label class="form-label small">비밀번호</label>
          <input id="pwd" type="password" name="password" class="form-control form-control-lg" required>
          <button type="button" class="btn-icon" id="pwd-toggle" aria-label="비밀번호 표시" title="비밀번호 표시">
            <i class="fa fa-eye"></i>
          </button>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="small-help">아이디/비밀번호는 서버 환경변수로 변경 가능</div>
          <button class="btn btn-primary">로그인</button>
        </div>
        <div class="footer-note">© 2025 PPE 감지 시스템</div>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('pwd-toggle').addEventListener('click', function(){
      const i = this.querySelector('i');
      const p = document.getElementById('pwd');
      if (p.type === 'password') { p.type = 'text'; i.classList.remove('fa-eye'); i.classList.add('fa-eye-slash'); }
      else { p.type = 'password'; i.classList.remove('fa-eye-slash'); i.classList.add('fa-eye'); }
    });
  </script>
</body>
</html>
