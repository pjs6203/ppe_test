<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>설정 · PPE 시스템</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- shared styles: login-card, mesh background, and utilities -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mesh.css') }}">
  <style>
    /* minimal overrides kept local */
    :root{ --primary-color: #3b82f6; }
    .main-container { padding: 2rem 0; }
  /* Ensure dropdown menus readable on dark */
  .dropdown-menu, .dropdown-menu .dropdown-item{ background: rgba(6,14,25,0.98); color:#f8fafc; }
  .form-select option{ color:#0b1220; background:#e5e7eb; } /* opened native list */
  /* Inline label widths (consistent) */
  .col-form-label{ color:#f8fafc; font-weight:600; min-width: 86px; }
  /* Page transition overlay */
  #page-transition{ position:fixed; inset:0; background:rgba(0,0,0,0.35); backdrop-filter: blur(6px); z-index:9999; opacity:0; pointer-events:none; transition: opacity .25s ease; }
  #page-transition.show{ opacity:1; pointer-events:auto; }
  #page-transition .spinner-border{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#60a5fa; }
  </style>
</head>
<body class="login-body">
  <div id="auth-bg" data-turbo-permanent><canvas id="mesh-canvas"></canvas></div>
  <div id="page-transition" data-turbo-permanent aria-hidden="true" data-duration="420" data-color="#000814" data-simple="1"><div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div></div>

  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark" aria-label="Main Navigation">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        <i class="fas fa-shield-alt me-2"></i>
        PPE 안전장비 감지 시스템
      </a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{{ url_for('webcam_page') }}">
          <i class="fas fa-video me-1"></i>
          실시간 감지
        </a>
        <a class="nav-link" href="{{ url_for('about') }}">
          <i class="fas fa-info-circle me-1"></i>
          시스템 정보
        </a>
        <a class="nav-link active" aria-current="page" href="{{ url_for('settings') }}" title="설정">
          <i class="fas fa-cog me-1"></i>
          설정
        </a>
      </div>
    </div>
  </nav>

  <div class="main-container settings-wrapper">
    <div class="container-fluid page-cards">
      <div class="row mb-4">
        <div class="col-12">
          <h1 class="h2 mb-2">
            <i class="fas fa-cogs me-2"></i>
            설정
          </h1>
          <p class="text-muted">실시간 시스템 모니터링 및 버전 정보</p>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="login-card panel-content">
            <h5 class="mb-3">실시간 스트림 설정</h5>
            <form id="settings-form">
              <div class="mb-3 row align-items-center">
                <label class="col-auto col-form-label">해상도</label>
                <div class="col">
                  <select id="resolution" class="form-select">
                    <option value="640x480">640×480</option>
                    <option value="1280x720">1280×720</option>
                    <option value="1920x1080">1920×1080</option>
                  </select>
                </div>
              </div>

              <div class="mb-3 row align-items-center">
                <label class="col-auto col-form-label">프레임 (FPS)</label>
                <div class="col">
                  <input id="fps" type="number" class="form-control form-control-lg" value="30" min="1" max="120">
                </div>
              </div>

              <div class="mb-3 row align-items-center">
                <label class="col-auto col-form-label">카메라</label>
                <div class="col">
                  <select id="camera" class="form-select"></select>
                </div>
              </div>

              <div class="mb-3 row align-items-center">
                <label class="col-auto col-form-label">사용할 모델</label>
                <div class="col">
                  <select id="model" class="form-select"></select>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">감지할 장구</label>
                <div class="d-flex gap-3">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="helmet" id="ppe-helmet" checked>
                    <label class="form-check-label" for="ppe-helmet">헬멧</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="vest" id="ppe-vest" checked>
                    <label class="form-check-label" for="ppe-vest">조끼</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="mask" id="ppe-mask" checked>
                    <label class="form-check-label" for="ppe-mask">마스크</label>
                  </div>
                </div>
              </div>

              <div class="d-flex gap-2">
                <button type="button" id="save-btn" class="btn btn-primary">저장</button>
                <button type="button" id="reset-btn" class="btn btn-outline-light">초기화</button>
              </div>
            </form>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="login-card panel-content">
            <h6>현재 설정</h6>
            <pre id="current-config" style="white-space:pre-wrap;color:#cbd5e1;background:transparent;border:none; min-height: 120px;">로딩 중...</pre>
            <hr class="text-secondary">
            <h6 class="mb-3">비밀번호 변경</h6>
            <div class="mb-2">
              <input id="pw-current" type="password" class="form-control" placeholder="현재 비밀번호">
            </div>
            <div class="mb-3">
              <input id="pw-new" type="password" class="form-control" placeholder="새 비밀번호">
            </div>
            <button type="button" id="pw-change-btn" class="btn btn-outline-light btn-sm">변경</button>
            <small id="pw-msg" class="d-block mt-2 text-muted"></small>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.4/dist/turbo.es2017-umd.js"></script>
  <script src="{{ url_for('static', filename='js/mesh-bg.js') }}"></script>
  <script src="{{ url_for('static', filename='js/pagefx.js') }}"></script>
  <script src="{{ url_for('static', filename='js/partial-transitions.js') }}"></script>
  <script>
    if (typeof initMesh === 'function' && !window.__meshInited) window.__meshInited = initMesh('mesh-canvas');
    // Initialize page FX for smooth transitions
    window.__pagefx = window.initPageFX && initPageFX();
    if (window.__pagefx){ __pagefx.bindAnchors(); __pagefx.playIntro(); }
  </script>
  <script>
async function fetchModels(){
  const r = await fetch('/api/models');
  const j = await r.json();
  const sel = document.getElementById('model');
  sel.innerHTML='';
  (j.files||[]).forEach(f=>{
    const opt = document.createElement('option'); opt.value=f; opt.textContent=f.split('/').pop(); sel.appendChild(opt);
  });
  // preselect requested or loaded
  if(j.requested && [...sel.options].some(o=>o.value===j.requested)) sel.value=j.requested;
  else if(j.loaded && [...sel.options].some(o=>o.value===j.loaded)) sel.value=j.loaded;
}

async function loadSettings(){
  const r = await fetch('/api/settings');
  const j = await r.json();
  document.getElementById('resolution').value = j.width && j.height ? `${j.width}x${j.height}` : (j.resolution||'1280x720');
  document.getElementById('fps').value = j.fps||30;
  await fetchCameras(j.cam_index);
  document.getElementById('ppe-helmet').checked = (j.ppe||[]).includes('helmet');
  document.getElementById('ppe-vest').checked = (j.ppe||[]).includes('vest');
  document.getElementById('ppe-mask').checked = (j.ppe||[]).includes('mask');
  document.getElementById('current-config').textContent = JSON.stringify(j, null, 2);
}

document.getElementById('save-btn').addEventListener('click', async ()=>{
  const overlay = document.getElementById('page-transition');
  overlay.classList.add('show');
  const payload = {
    width: parseInt(document.getElementById('resolution').value.split('x')[0],10)||1280,
    height: parseInt(document.getElementById('resolution').value.split('x')[1],10)||720,
    fps: parseInt(document.getElementById('fps').value,10)||30,
    model: document.getElementById('model').value,
  cam_index: parseInt(document.getElementById('camera').value,10),
    ppe: [document.getElementById('ppe-helmet').checked? 'helmet': null, document.getElementById('ppe-vest').checked? 'vest': null, document.getElementById('ppe-mask').checked? 'mask': null].filter(Boolean)
  };
  const r = await fetch('/api/settings', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  overlay.classList.remove('show');
  if(r.ok){ alert('설정이 저장되었습니다'); loadSettings(); }
  else{ alert('저장 실패'); }
});

document.getElementById('reset-btn').addEventListener('click', ()=>{ if(confirm('설정을 기본값으로 초기화할까요?')){ fetch('/api/settings/reset', {method:'POST'}).then(()=>loadSettings()); } });

// init
fetchModels(); loadSettings();

// Camera list
async function fetchCameras(selected){
  const r = await fetch('/api/cameras');
  const j = await r.json();
  const sel = document.getElementById('camera');
  sel.innerHTML='';
  (j.cameras||[]).forEach(c=>{
    const opt = document.createElement('option'); opt.value=c.index; opt.textContent=`${c.name}`; sel.appendChild(opt);
  });
  const target = (selected ?? j.selected);
  if(target!==undefined) sel.value = String(target);
}

// Password change
document.getElementById('pw-change-btn').addEventListener('click', async ()=>{
  const cur = document.getElementById('pw-current').value;
  const nw = document.getElementById('pw-new').value;
  const msg = document.getElementById('pw-msg');
  msg.textContent = '';
  if(!nw || !cur){ msg.textContent = '현재/새 비밀번호를 모두 입력하세요.'; return; }
  const overlay = document.getElementById('page-transition'); overlay.classList.add('show');
  const r = await fetch('/api/change_password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ current: cur, new: nw })});
  overlay.classList.remove('show');
  if(r.ok){ msg.textContent = '비밀번호가 변경되었습니다.'; document.getElementById('pw-current').value=''; document.getElementById('pw-new').value=''; }
  else{ const j = await r.json().catch(()=>({error:'실패'})); msg.textContent = '변경 실패: ' + (j.error||'오류'); }
});

// Smooth page transitions
// Legacy overlay fallback kept minimal (PageFX handles most)
</script>
</body>
</html>
