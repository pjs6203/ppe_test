    /* Minimal overrides: keep sizes and icons, unify card look to match settings (login-card) */
    .main-container { padding: 2rem 0; }

    /* Make any .card elements visually match the settings page login-card */
    .card {
      background: rgba(6,14,25,0.85);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      color: #f8fafc;
      box-shadow: 0 18px 60px rgba(2,6,23,0.35);
      backdrop-filter: blur(6px);
    }
    .card-header {
      background: transparent;
      border: 0;
      padding: 1rem 1.25rem;
    }
    .card-header h5 { color: #f8fafc; font-weight: 600; font-size: 1.1rem; }
    .card-body { padding: 1.25rem; }

    .status-card { transition: all 0.3s ease; position: relative; overflow: hidden; }
    .status-card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, #2563eb, #10b981); opacity: 0; transition: opacity 0.3s ease; }
    .status-card.active::before { opacity: 1; }

    .video-container {
      position: relative;
      border-radius: 16px;
      overflow: hidden; /* ensure anything larger is clipped */
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);

      justify-content: center;

    /* when video is inside a card-body, keep a subtle inner padding to separate from card border */
    .card .video-container { padding: 0.5rem; }

    .video-feed {
      display: block;
      max-width: 100%;
      width: auto;
      height: auto;
      max-height: 70vh; /* keep it from growing too tall */
      object-fit: contain; /* preserve aspect ratio and center inside container */
      border-radius: 0; /* keep container's rounded corners only */

    .hud-overlay {

      right: 1rem;

      border: 1px solid rgba(255,255,255,0.06);

    .hud-item {

      align-items: center;

    .status-indicator {

  <script>
    let lastOkTs = 0;
    const LS_KEY_MODEL = "yd_selected_model";
    
    function basename(p) { 
      return p ? p.split(/[\\/]/).pop() : p; 
    }

    function setSelectToPath(sel, targetPath) {
      if (!targetPath) return false;
      sel.value = targetPath;
      if (sel.value === targetPath) return true;
      const tb = basename(targetPath);
      for (const opt of sel.options) {
        if (basename(opt.value) === tb) { 
          sel.value = opt.value; 
          return true; 
        }
      }
      return false;
    }

    async function loadModels() {
      try {
        const r = await fetch("/api/models", { cache: "no-store" });
        const d = await r.json();
        const sel = document.getElementById("model-select");
        sel.innerHTML = "";
        
        (d.files || []).forEach(fp => {
          const opt = document.createElement("option");
          opt.value = fp;
          opt.textContent = basename(fp);
          sel.appendChild(opt);
        });
        
        const pref = localStorage.getItem(LS_KEY_MODEL);
        if (!setSelectToPath(sel, pref) && !setSelectToPath(sel, d.requested) && !setSelectToPath(sel, d.loaded)) {
          if (sel.options.length) sel.selectedIndex = 0;
        }
        updateModelHint(d);
      } catch (error) {
        console.error("모델 로딩 실패:", error);
      }
    }

    function updateModelHint(d) {
      const hint = document.getElementById("model-hint");
      const rq = d.requested ? basename(d.requested) : "-";
      const ld = d.loaded ? basename(d.loaded) : "-";
      const err = d.error ? ` (오류: ${d.error})` : "";
      const same = (d.requested && d.loaded && d.requested === d.loaded);
      
      if (same) {
        hint.innerHTML = `<i class="fas fa-check-circle text-success me-1"></i>로드된 모델: ${ld}`;
      } else {
        hint.innerHTML = `<span class="loading-spinner me-1"></span>전환 중... 요청: ${rq}, 로딩: ${ld}${err}`;
      }
    }

    async function changeModel(path) {
      localStorage.setItem(LS_KEY_MODEL, path);
      try {
        await fetch("/api/select_model", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path })
        });
        refreshModels();
      } catch (error) {
        console.error("모델 변경 실패:", error);
      }
    }

    async function refreshModels() {
      try {
        const r = await fetch("/api/models", { cache: "no-store" });
        const d = await r.json();
        updateModelHint(d);
        const sel = document.getElementById("model-select");
        setSelectToPath(sel, d.requested || d.loaded);
      } catch (error) {
        console.error("모델 새로고침 실패:", error);
      }
    }

  function updatePPEGrid(ppeData) {
      const grid = document.getElementById("ppe-grid");
      const items = grid.children;
      
      // PPE 아이템 상태 업데이트
      const ppeItems = {
        'helmet': items[0],
        'vest': items[1], 
        'mask': items[2],
        'person': items[3]
      };

      // 아이템 클래스 제어는 가이던스 컨트롤러가 소유하도록 위임
      if (!window.__ppeGuidanceOwnsGrid) {
        // 모든 아이템 초기화
        Object.values(ppeItems).forEach(item => { item.className = 'ppe-item'; });

        // 상태에 따른 업데이트
        if (ppeData.has_person) {
          ppeItems.person.className = 'ppe-item safe';
          Object.entries(ppeData.present).forEach(([key, present]) => {
            if (ppeItems[key]) {
              if (present) {
                ppeItems[key].className = 'ppe-item safe';
              } else if (ppeData.required.includes(key)) {
                ppeItems[key].className = 'ppe-item violation';
              } else {
                ppeItems[key].className = 'ppe-item warning';
              }
            }
          });
        }
      }

      // 전체 상태 업데이트
      const overallStatus = document.getElementById("ppe-overall-status");
      const overallText = document.getElementById("ppe-overall-text");
      
      if (!ppeData.has_person) {
        overallStatus.className = 'status-indicator';
        overallText.textContent = '작업자 없음';
      } else if (ppeData.status_code === 'safe') {
        overallStatus.className = 'status-indicator online';
        overallText.textContent = '안전';
      } else if (ppeData.status_code === 'violation') {
        overallStatus.className = 'status-indicator error';
        overallText.textContent = '위반';
      } else {
        overallStatus.className = 'status-indicator warning';
        overallText.textContent = '확인 필요';
      }
    }

    function showAlert(message, type = 'warning') {
      const alertSection = document.getElementById('alert-section');
      const alertMessage = document.getElementById('alert-message');
      
      alertMessage.textContent = message;
      alertSection.style.display = 'block';
      
      // 5초 후 자동 숨김
      setTimeout(() => {
        alertSection.style.display = 'none';
      }, 5000);
    }

    async function pollStats() {
      try {
        const [sRes, ppeRes] = await Promise.all([
          fetch("/api/stream_stats?cam=entrance", { cache: "no-store" }),
          fetch("/api/ppe_status?cam=entrance", { cache: "no-store" }),
        ]);
        
        const s = await sRes.json();
        const p = await ppeRes.json();

        const ok = (s && (s.width ?? 0) > 0);
        
        // 스트림 통계 업데이트
        document.getElementById("stat-res").textContent = s.resolution ?? "-";
        document.getElementById("stat-fps").textContent = (s.fps ?? 0).toFixed(1);
        document.getElementById("stat-frame").textContent = (s.frame_index ?? 0).toLocaleString();
        document.getElementById("hud-res").textContent = s.resolution ?? "-";
        document.getElementById("hud-fps").textContent = (s.fps ?? 0).toFixed(1);
        document.getElementById("hud").hidden = !ok;

        // 시스템 상태 업데이트
        const statusElement = document.getElementById("stat-status");
        if (ok) { 
          lastOkTs = Date.now(); 
          statusElement.textContent = "실행 중";
          statusElement.className = "stat-value text-success";
        } else if (Date.now() - lastOkTs > 4000) { 
          statusElement.textContent = "신호 없음";
          statusElement.className = "stat-value text-danger";
        } else { 
          statusElement.textContent = "초기화";
          statusElement.className = "stat-value text-warning";
        }

        // PPE 상태 업데이트
        updatePPEGrid(p);
        
      } catch (error) {
        console.error("통계 폴링 실패:", error);
      }
    }

    // 이벤트 리스너
    document.addEventListener("change", (ev) => {
      if (ev.target && ev.target.id === "model-select") {
        changeModel(ev.target.value);
      }
    });

    // 초기화
    loadModels().then(() => refreshModels());
    setInterval(refreshModels, 1000);
    pollStats();
    setInterval(pollStats, 500);

    // 비디오 로딩 처리
    const img = document.getElementById('video');
    const skeleton = document.getElementById('skeleton');
    img.addEventListener('load', () => { 
      skeleton.classList.add('d-none'); 
    });
    img.addEventListener('error', () => { 
      skeleton.classList.remove('d-none'); 
    });

  // Initialize PageFX transitions
  window.__pagefx = window.initPageFX && initPageFX();
  if (window.__pagefx){ __pagefx.bindAnchors(); __pagefx.playIntro(); }
  </script>
  <script>
    // PPE guidance controller
    (function(){
      const POLL_MS = 1000;
      const ITEM_CONFIRM_MS = 2000; // 보호구 착용 지속 확인 시간
      const SAFE_TOAST_MS = 1500;   // 전체 안전 확인시 안내 표시 시간

      function bind(){
        const grid = document.getElementById('ppe-grid');
        const elGuide = document.getElementById('guidance');
        if (!grid || !elGuide || elGuide.dataset.bound === '1') return;
        // cleanup any previous timer on element
        if (elGuide.__ppeTimer){ try{ clearInterval(elGuide.__ppeTimer); }catch{} }
        elGuide.dataset.bound = '1';
        window.__ppeGuidanceOwnsGrid = true;

        const elGuideTitle = document.getElementById('guide-title');
        const elGuideText = document.getElementById('guide-text');
        const elGuideIcons = document.getElementById('guide-icons');
        const guideGrid = document.getElementById('guide-ppe-grid');
        const alertSec = document.getElementById('alert-section');
        const alertMsg = document.getElementById('alert-message');

        // data-key 부여(helmet, vest, mask, person)
        (function ensureKeys(){
          const labels = ['helmet','vest','mask','person'];
          [...grid.querySelectorAll('.ppe-item')].forEach((el, i)=>{ if(!el.dataset.key && labels[i]) el.dataset.key = labels[i]; el.style.position='relative'; });
        })();

        const presentSince = Object.create(null);
        let safeToastTimer = null;

        const ICONS = { helmet:'fa-hard-hat', vest:'fa-tshirt', mask:'fa-mask', glasses:'fa-glasses', shoes:'fa-shoe-prints', person:'fa-user' };
        const LABELS = { helmet:'헬멧', vest:'조끼', mask:'마스크', shoes:'안전화', glasses:'보안경', person:'작업자' };
        function showGuide(title, text, iconKeys){
          elGuideTitle.textContent = title;
          elGuideText.textContent = text || '';
          if (Array.isArray(iconKeys) && iconKeys.length){
            elGuideIcons.innerHTML = iconKeys.map(k=>{
              const ic = ICONS[k] || 'fa-circle';
              const lb = LABELS[k] || k;
              return `<div class="g-icon violation" title="${lb}"><i class="fas ${ic}"></i></div>`;
            }).join('');
            elGuideIcons.hidden = false;
          } else {
            elGuideIcons.innerHTML = '';
            elGuideIcons.hidden = true;
          }
          elGuide.hidden = false;
        }
        function hideGuide(){ elGuide.hidden = true; }
        function setItemState(key, state){
          const els = [
            grid.querySelector(`.ppe-item[data-key="${key}"]`),
            guideGrid && guideGrid.querySelector(`.ppe-item[data-key="${key}"]`)
          ].filter(Boolean);
          els.forEach((el)=>{
            el.classList.remove('ok','warning','violation','safe');
            if(state === 'ok') { el.classList.add('safe','ok'); }
            else if(state) { el.classList.add(state); }
          });
        }
        function formatList(keys){ const ko = { helmet:'헬멧', vest:'조끼', mask:'마스크', shoes:'안전화', glasses:'보안경' }; return keys.map(k=> ko[k]||k).join(', '); }

        async function poll(){
          try{
            const r = await fetch('/api/ppe_status', { cache:'no-store' });
            const s = await r.json();
            // 사람 감지
            if (!s.has_person){
              ['helmet','vest','mask'].forEach(k=> setItemState(k, 'warning'));
              setItemState('person', 'violation');
              showGuide('작업자 미감지', '카메라 정면에 서고, 프레임 안에 위치해 주세요.', ['person']);
              alertSec.style.display = 'none';
              guideGrid.hidden = true;
              // reset sustained-wear timers so next detection requires fresh confirmation
              Object.keys(presentSince).forEach(k=> presentSince[k] = 0);
              clearTimeout(safeToastTimer); safeToastTimer = null;
              return;
            }

            hideGuide();
            const required = Array.isArray(s.required)? s.required.filter(k=> ['helmet','vest','mask','glasses','shoes'].includes(k)) : ['helmet','vest','mask'];
            const missing = Array.isArray(s.missing_required)? s.missing_required : [];
            const present = s.present || {};
            setItemState('person', 'ok');

            // 타이머 갱신
            required.forEach(k=>{ if (present[k]){ if (!presentSince[k]) presentSince[k] = Date.now(); } else { presentSince[k] = 0; } });

            // UI 반영
            required.forEach(k=>{
              if (present[k]){
                const okFor = presentSince[k] ? (Date.now() - presentSince[k]) : 0;
                setItemState(k, okFor >= ITEM_CONFIRM_MS ? 'ok' : 'warning');
              } else { setItemState(k, 'violation'); }
            });

            // 안내/알림
            if (missing.length){
              // 직관적 아이콘 중심의 안내 표시
              showGuide('안전 위반 감지', '보호구를 착용하십시오.', missing);
              alertSec.style.display = 'none';
              guideGrid.hidden = false;
            } else {
              alertSec.style.display = 'none';
              const allOk = required.every(k=> present[k] && (Date.now() - (presentSince[k]||0)) >= ITEM_CONFIRM_MS);
              if (allOk){
                showGuide('안전 확인', '보호구 착용이 확인되었습니다.');
                clearTimeout(safeToastTimer);
                safeToastTimer = setTimeout(hideGuide, SAFE_TOAST_MS);
                guideGrid.hidden = true;
              } else {
                // 착용 확인 대기 상태 시에도 오버레이에 상태를 표시
                showGuide('착용 확인 중', '보호구 착용을 확인하고 있습니다.');
                guideGrid.hidden = false;
              }
            }
          }catch(e){ /* ignore */ }
        }

        // start polling and keep timer handle on element
        poll();
        elGuide.__ppeTimer = setInterval(poll, POLL_MS);
      }

      // Bind on Turbo navigations and initial load
      document.addEventListener('turbo:render', bind);
      document.addEventListener('turbo:load', bind);
      // Cleanup before caching this page
      document.addEventListener('turbo:before-cache', ()=>{
        const elGuide = document.getElementById('guidance');
        if (elGuide && elGuide.__ppeTimer){ try{ clearInterval(elGuide.__ppeTimer); }catch{} }
        if (elGuide) { delete elGuide.dataset.bound; }
        window.__ppeGuidanceOwnsGrid = false;
      });
      // Try bind immediately as well
      bind();
    })();
  </script>
