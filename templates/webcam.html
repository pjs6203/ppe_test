<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PPE 안전장비 실시간 감지 시스템</title>
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #3b82f6;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --dark-bg: #0f172a;
      --card-bg: #1e293b;
      --border-color: #475569;
      --text-primary: #ffffff;
      --text-secondary: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text-primary);
      min-height: 100vh;
      font-weight: 400;
      line-height: 1.6;
    }

    .navbar {
      background: rgba(15, 23, 42, 0.98) !important;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }

    .navbar-brand {
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--primary-color) !important;
    }

    .main-container {
      padding: 2rem 0;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
    }

    .card-header {
      background: rgba(30, 41, 59, 0.9);
      border-bottom: 1px solid var(--border-color);
      border-radius: 16px 16px 0 0 !important;
      padding: 1.5rem;
    }

    .card-header h5 {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 1.1rem;
    }

    .card-body {
      padding: 1.5rem;
    }

    .status-card {
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .status-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-color), var(--success-color));
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .status-card.active::before {
      opacity: 1;
    }

    .video-container {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .video-feed {
      width: 100%;
      max-height: 70vh;
      border-radius: 16px;
      transition: all 0.3s ease;
    }

    .hud-overlay {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .hud-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .hud-item:last-child {
      margin-bottom: 0;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-secondary);
      transition: all 0.3s ease;
      position: relative;
    }

    .status-indicator.online {
      background: var(--success-color);
      box-shadow: 0 0 10px var(--success-color);
    }

    .status-indicator.warning {
      background: var(--warning-color);
      box-shadow: 0 0 10px var(--warning-color);
    }

    .status-indicator.error {
      background: var(--danger-color);
      box-shadow: 0 0 10px var(--danger-color);
    }

    .ppe-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .ppe-item {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      transition: all 0.3s ease;
    }

    .ppe-item.safe {
      border-color: var(--success-color);
      background: rgba(16, 185, 129, 0.15);
    }

    .ppe-item.violation {
      border-color: var(--danger-color);
      background: rgba(239, 68, 68, 0.15);
      animation: pulse 2s infinite;
    }

    .ppe-item.warning {
      border-color: var(--warning-color);
      background: rgba(245, 158, 11, 0.15);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .ppe-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .ppe-item.safe .ppe-icon {
      color: var(--success-color);
    }

    .ppe-item.violation .ppe-icon {
      color: var(--danger-color);
    }

    .ppe-item.warning .ppe-icon {
      color: var(--warning-color);
    }

    .ppe-item .small {
      color: var(--text-primary);
      font-weight: 500;
      font-size: 0.85rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .stat-item {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-color);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .stat-label {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
      font-weight: 500;
    }

    .model-selector {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      padding: 0.5rem;
      font-size: 0.9rem;
    }

    .model-selector:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
    }

    .btn-primary {
      background: var(--primary-color);
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-weight: 500;
      transition: all 0.3s ease;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
    }

    .alert-custom {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger-color);
      border-radius: 12px;
      color: var(--text-primary);
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: var(--primary-color);
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .skeleton {
      width: 100%;
      min-height: 400px;
      background: linear-gradient(90deg, 
        rgba(30, 41, 59, 0.5) 25%, 
        rgba(71, 85, 105, 0.5) 50%, 
        rgba(30, 41, 59, 0.5) 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 16px;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* 텍스트 가독성 개선 */
    h1, h2, h3, h4, h5, h6 {
      color: var(--text-primary);
      font-weight: 600;
    }

    .text-muted {
      color: var(--text-muted) !important;
    }

    .small {
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* 상태 텍스트 강조 */
    #ppe-overall-text {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-primary);
    }

    /* 모델 힌트 텍스트 개선 */
    #model-hint {
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .main-container {
        padding: 1rem 0;
      }
      
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .ppe-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .hud-overlay {
        position: relative;
        top: auto;
        right: auto;
        margin-top: 1rem;
      }
    }
  </style>
</head>

  <nav class="navbar navbar-expand-lg navbar-dark" aria-label="Main Navigation">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        <i class="fas fa-shield-alt me-2"></i>

      </a>
             <div class="navbar-nav ms-auto">

  <div class="main-container">
    <div class="container-fluid">
      <!-- Header -->
      <div class="row mb-4">
        <div class="col-12">
          <h1 class="h2 mb-2">
            <i class="fas fa-video me-2"></i>

          <p class="text-muted">웹캠을 통한 실시간 PPE(개인보호장비) 감지 및 모니터링</p>
        </div>

      <div class="row">
        <!-- Left Column - Stats & Controls -->
        <div class="col-lg-4 col-md-5 mb-4">
          <!-- System Status Card -->
          <div class="card status-card active mb-4">
            <div class="card-header">
              <h5 class="mb-0">
                <i class="fas fa-tachometer-alt me-2"></i>
                시스템 상태
              </h5>
            </div>
            <div class="card-body">
              <div class="stats-grid">
                <div class="stat-item">
                  <div class="stat-value" id="stat-fps">-</div>

                </div>
                <div class="stat-item">

          </div>

          <!-- Model Selection Card -->
          <div class="card mb-4">

              <h5 class="mb-0">

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    let lastOkTs = 0;
    const LS_KEY_MODEL = "yd_selected_model";
    
    function basename(p) { 
      return p ? p.split(/[\\/]/).pop() : p; 
    }

    function setSelectToPath(sel, targetPath) {
      if (!targetPath) return false;
      sel.value = targetPath;
      if (sel.value === targetPath) return true;
      const tb = basename(targetPath);
      for (const opt of sel.options) {
        if (basename(opt.value) === tb) { 
          sel.value = opt.value; 
          return true; 
        }
      }
      return false;
    }

    async function loadModels() {
      try {
        const r = await fetch("/api/models", { cache: "no-store" });
        const d = await r.json();
        const sel = document.getElementById("model-select");
        sel.innerHTML = "";
        
        (d.files || []).forEach(fp => {
          const opt = document.createElement("option");
          opt.value = fp;
          opt.textContent = basename(fp);
          sel.appendChild(opt);
        });
        
        const pref = localStorage.getItem(LS_KEY_MODEL);
        if (!setSelectToPath(sel, pref) && !setSelectToPath(sel, d.requested) && !setSelectToPath(sel, d.loaded)) {
          if (sel.options.length) sel.selectedIndex = 0;
        }
        updateModelHint(d);
      } catch (error) {
        console.error("모델 로딩 실패:", error);
      }
    }

    function updateModelHint(d) {
      const hint = document.getElementById("model-hint");
      const rq = d.requested ? basename(d.requested) : "-";
      const ld = d.loaded ? basename(d.loaded) : "-";
      const err = d.error ? ` (오류: ${d.error})` : "";
      const same = (d.requested && d.loaded && d.requested === d.loaded);
      
      if (same) {
        hint.innerHTML = `<i class="fas fa-check-circle text-success me-1"></i>로드된 모델: ${ld}`;
      } else {
        hint.innerHTML = `<span class="loading-spinner me-1"></span>전환 중... 요청: ${rq}, 로딩: ${ld}${err}`;
      }
    }

    async function changeModel(path) {
      localStorage.setItem(LS_KEY_MODEL, path);
      try {
        await fetch("/api/select_model", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ path })
        });
        refreshModels();
      } catch (error) {
        console.error("모델 변경 실패:", error);
      }
    }

    async function refreshModels() {
      try {
        const r = await fetch("/api/models", { cache: "no-store" });
        const d = await r.json();
        updateModelHint(d);
        const sel = document.getElementById("model-select");
        setSelectToPath(sel, d.requested || d.loaded);
      } catch (error) {
        console.error("모델 새로고침 실패:", error);
      }
    }

    function updatePPEGrid(ppeData) {
      const grid = document.getElementById("ppe-grid");
      const items = grid.children;
      
      // PPE 아이템 상태 업데이트
      const ppeItems = {
        'helmet': items[0],
        'vest': items[1], 
        'mask': items[2],
        'person': items[3]
      };

      // 모든 아이템 초기화
      Object.values(ppeItems).forEach(item => {
        item.className = 'ppe-item';
      });

      // 상태에 따른 업데이트
      if (ppeData.has_person) {
        ppeItems.person.className = 'ppe-item safe';
        
        Object.entries(ppeData.present).forEach(([key, present]) => {
          if (ppeItems[key]) {
            if (present) {
              ppeItems[key].className = 'ppe-item safe';
            } else if (ppeData.required.includes(key)) {
              ppeItems[key].className = 'ppe-item violation';
            } else {
              ppeItems[key].className = 'ppe-item warning';
            }
          }
        });
      }

      // 전체 상태 업데이트
      const overallStatus = document.getElementById("ppe-overall-status");
      const overallText = document.getElementById("ppe-overall-text");
      
      if (!ppeData.has_person) {
        overallStatus.className = 'status-indicator';
        overallText.textContent = '작업자 없음';
      } else if (ppeData.status_code === 'safe') {
        overallStatus.className = 'status-indicator online';
        overallText.textContent = '안전';
      } else if (ppeData.status_code === 'violation') {
        overallStatus.className = 'status-indicator error';
        overallText.textContent = '위반';
      } else {
        overallStatus.className = 'status-indicator warning';
        overallText.textContent = '확인 필요';
      }
    }

    function showAlert(message, type = 'warning') {
      const alertSection = document.getElementById('alert-section');
      const alertMessage = document.getElementById('alert-message');
      
      alertMessage.textContent = message;
      alertSection.style.display = 'block';
      
      // 5초 후 자동 숨김
      setTimeout(() => {
        alertSection.style.display = 'none';
      }, 5000);
    }

    async function pollStats() {
      try {
        const [sRes, ppeRes] = await Promise.all([
          fetch("/api/stream_stats", { cache: "no-store" }),
          fetch("/api/ppe_status", { cache: "no-store" }),
        ]);
        
        const s = await sRes.json();
        const p = await ppeRes.json();

        const ok = (s && (s.width ?? 0) > 0);
        
        // 스트림 통계 업데이트
        document.getElementById("stat-res").textContent = s.resolution ?? "-";
        document.getElementById("stat-fps").textContent = (s.fps ?? 0).toFixed(1);
        document.getElementById("stat-frame").textContent = (s.frame_index ?? 0).toLocaleString();
        document.getElementById("hud-res").textContent = s.resolution ?? "-";
        document.getElementById("hud-fps").textContent = (s.fps ?? 0).toFixed(1);
        document.getElementById("hud").hidden = !ok;

        // 시스템 상태 업데이트
        const statusElement = document.getElementById("stat-status");
        if (ok) { 
          lastOkTs = Date.now(); 
          statusElement.textContent = "실행 중";
          statusElement.className = "stat-value text-success";
        } else if (Date.now() - lastOkTs > 4000) { 
          statusElement.textContent = "신호 없음";
          statusElement.className = "stat-value text-danger";
        } else { 
          statusElement.textContent = "초기화";
          statusElement.className = "stat-value text-warning";
        }

        // PPE 상태 업데이트
        updatePPEGrid(p);
        
      } catch (error) {
        console.error("통계 폴링 실패:", error);
      }
    }

    // 이벤트 리스너
    document.addEventListener("change", (ev) => {
      if (ev.target && ev.target.id === "model-select") {
        changeModel(ev.target.value);
      }
    });

    // 초기화
    loadModels().then(() => refreshModels());
    setInterval(refreshModels, 1000);
    pollStats();
    setInterval(pollStats, 500);

    // 비디오 로딩 처리
    const img = document.getElementById('video');
    const skeleton = document.getElementById('skeleton');
    img.addEventListener('load', () => { 
      skeleton.classList.add('d-none'); 
    });
    img.addEventListener('error', () => { 
      skeleton.classList.remove('d-none'); 
    });
  </script>
</body>
</html>
